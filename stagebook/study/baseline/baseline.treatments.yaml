templates:
  - name: recallTask
    contentType: stages
    # an individual recall and feedback stage
    content:
      - name: recall_${roundIndex}_${recallIndex}
        duration: 30
        elements:
          - type: image
            file: ${imageFilepath}
          - type: prompt
            name: "recall_${roundIndex}_${recallIndex}"
            file: game/recall.prompt.md
          - type: submitButton
            buttonText: Submit
            name: "recall_${roundIndex}_${recallIndex}"

      - name: "feedback_${roundIndex}_${recallIndex}"
        duration: 15
        elements:
          - type: image
            file: ${imageFilepath}
          - type: prompt
            file: game/labels_correct.prompt.md
            # TODO migrate percentAgreement: no auto-migration. Original
            # intent: show "all correct" when 100% of players entered the
            # same label AND every player entered something at least 1 char
            # long. The boolean tree can't express "two refs are equal to
            # each other" without a counting stage. Decide:
            #   (a) re-express via a separate counting stage, or
            #   (b) drop the gating and always show both prompts.
            conditions:
              - reference: "prompt.recall_${roundIndex}_${recallIndex}"
                position: percentAgreement
                comparator: equals
                value: 100
              - all:
                  - reference: "prompt.recall_${roundIndex}_${recallIndex}"
                    position: 0
                    comparator: hasLengthAtLeast
                    value: 1
                  - reference: "prompt.recall_${roundIndex}_${recallIndex}"
                    position: 1
                    comparator: hasLengthAtLeast
                    value: 1
          - type: prompt
            file: game/labels_incorrect.prompt.md
            # TODO migrate percentAgreement: no auto-migration. Original
            # intent: show "incorrect" when <100% of players entered the
            # same label. Same caveat as labels_correct above.
            conditions:
              - reference: "prompt.recall_${roundIndex}_${recallIndex}"
                position: percentAgreement
                comparator: isBelow
                value: 100
          - type: prompt # when nobody enters anything, agreement is not defined
            file: game/labels_incorrect.prompt.md
            conditions:
              all:
                - reference: "prompt.recall_${roundIndex}_${recallIndex}"
                  position: 0
                  comparator: doesNotExist
                - reference: "prompt.recall_${roundIndex}_${recallIndex}"
                  position: 1
                  comparator: doesNotExist

          - type: display
            reference: "prompt.recall_${roundIndex}_${recallIndex}"
            position: 0
          - type: display
            reference: "prompt.recall_${roundIndex}_${recallIndex}"
            position: 1
          - type: submitButton

  - name: round
    contentType: stages
    # a round of discussion and recall tasks
    content:
      - name: "instructions_${roundIndex}"
        duration: 30
        elements:
          - type: prompt
            file: "game/round_${roundIndex}_pre_instructions.prompt.md"
            name: "instructions_${roundIndex}"
          - type: submitButton
            buttonText: Begin
            name: "instructions_${roundIndex}"

      - name: "Discussion ${roundIndex}"
        duration: ${duration}
        discussion:
          chatType: video
          showNickname: true
          showTitle: false
        elements:
          - type: image
            file: ${panelFilepath}
          - type: submitButton
            buttonText: End discussion and go to quiz
            name: "labeling_${roundIndex}"

          - type: prompt
            name: "labeling_${roundIndex}"
            file: game/discussion_instructions_${numImages}.prompt.md
            shared: true

      - name: "confidence_${roundIndex}"
        duration: 30
        elements:
          - type: prompt
            file: game/confidence.prompt.md
            name: "confidence_${roundIndex}"
          - type: submitButton

      - template: recallTask
        fields:
          recallIndex: ${d0}
          roundIndex: ${roundIndex}
        broadcast:
          d0: ${recallImages}

  - name: exitSequence
    contentType: exitSteps
    # exit-survey sequence shared across all treatments
    content:
      - name: Discussion General
        elements:
          - type: survey
            surveyName: DiscussionGeneral
      - name: strategy
        elements:
          - type: prompt
            file: exit/strategy_describe.prompt.md
            name: strategy
          - type: submitButton # we request 200+ characters, but don't enforce it.
            buttonText: Submit
      - name: mistake
        elements:
          - type: prompt
            file: exit/mistake_reasons.prompt.md
            name: mistake
          - type: submitButton
            buttonText: Submit
      - name: working_together
        elements:
          - type: prompt
            file: exit/working_together.prompt.md
            name: working_together
          - type: submitButton
            buttonText: Submit
      - name: playedBefore
        elements:
          - type: prompt
            file: exit/played_before.prompt.md
          - type: submitButton
            buttonText: Submit
            name: "exit_played_before"
      - name: Demographics
        elements:
          - type: survey
            surveyName: Demographics

introSequences:
  - name: Default
    introSteps:
      - name: Instructions Page
        elements:
          - type: prompt
            file: intro/instructions.prompt.md
          - type: prompt
            file: intro/comp_rounds.prompt.md
            name: comp_rounds
          - type: prompt
            file: intro/comp_reuse_round.prompt.md
            name: comp_reuse_round
            conditions:
              - reference: prompt.comp_rounds
                comparator: equals
                value: "4 rounds"
          - type: prompt
            file: intro/comp_reuse_game.prompt.md
            name: comp_reuse_game
            conditions:
              - reference: prompt.comp_reuse_round
                comparator: equals
                value: "No"
          - type: prompt
            file: intro/comp_fill_in_labels.prompt.md
            name: comp_fill_in_labels
            conditions:
              - reference: prompt.comp_reuse_game
                comparator: equals
                value: "Yes"
          - type: prompt
            file: intro/comp_screenshot.prompt.md
            name: comp_screenshot
            conditions:
              - reference: prompt.comp_fill_in_labels
                comparator: equals
                value: "Yes"
          - type: submitButton
            name: instructions_page
            buttonText: Begin
            conditions:
              - reference: prompt.comp_screenshot
                comparator: equals
                value: "No"

