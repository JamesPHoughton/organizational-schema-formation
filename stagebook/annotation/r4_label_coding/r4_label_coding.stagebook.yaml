introSequences:
  - name: default
    introSteps:
      - name: instructions
        elements:
          - type: prompt
            file: intro/instructions.prompt.md

          - type: prompt
            file: intro/practice_1.prompt.md
            name: practice_1
          - type: prompt
            file: intro/practice_2.prompt.md
            name: practice_2
            conditions:
              - reference: self.prompt.practice_1
                comparator: equals
                value: "One-off label"
          - type: prompt
            file: intro/practice_3.prompt.md
            name: practice_3
            conditions:
              - reference: self.prompt.practice_2
                comparator: equals
                value: "Systematic label"
          - type: submitButton
            buttonText: "Start the task"
            conditions:
              - reference: self.prompt.practice_3
                comparator: equals
                value: "One-off label"

treatments:
  - name: r4_label_coding
    playerCount: 1
    gameStages:
      - name: r4_label_coding
        duration: 1800
        elements:
          - type: prompt
            file: task/coding_criteria.prompt.md

          - type: separator
            style: thick
          # ===== Context: this participant's R4 labels =====
          - type: prompt
            file: ${contextFile}

          # ===== Label 1 =====
          - type: prompt
            file: ${labelFile1}
            name: label_1_category

          # ===== Label 2 =====
          - type: prompt
            file: ${labelFile2}
            name: label_2_category

          # ===== Label 3 =====
          - type: prompt
            file: ${labelFile3}
            name: label_3_category

          # ===== Label 4 =====
          - type: prompt
            file: ${labelFile4}
            name: label_4_category

          # ===== Label 5 =====
          - type: prompt
            file: ${labelFile5}
            name: label_5_category

          # ===== Label 6 =====
          - type: prompt
            file: ${labelFile6}
            name: label_6_category

          # ===== Label 7 =====
          - type: prompt
            file: ${labelFile7}
            name: label_7_category

          # ===== Label 8 =====
          - type: prompt
            file: ${labelFile8}
            name: label_8_category

          - type: separator
            style: thick
          - type: prompt
            file: task/notes.prompt.md
            name: coding_notes

          - type: submitButton
            conditions:
              - reference: self.prompt.label_1_category
                comparator: exists
              - reference: self.prompt.label_2_category
                comparator: exists
              - reference: self.prompt.label_3_category
                comparator: exists
              - reference: self.prompt.label_4_category
                comparator: exists
              - reference: self.prompt.label_5_category
                comparator: exists
              - reference: self.prompt.label_6_category
                comparator: exists
              - reference: self.prompt.label_7_category
                comparator: exists
              - reference: self.prompt.label_8_category
                comparator: exists
